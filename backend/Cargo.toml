[package]
name = "mp-backend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mp_backend"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "mp-backend"
path = "src/main.rs"

[[bin]]
name = "mp-run"
path = "src/bin/mp_run.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
